<!DOCTYPE html>

            <td class="py-3 px-4 border border-gray-200">Surakarta</td>

          <tr class="hover:bg-indigo-50/50 transition-colors">

          </tr>
          <tr class="hover:bg-indigo-50/50 transition-colors">
            <td class="py-3 px-4 border border-gray-200">3</td>
            <td class="py-3 px-4 border border-gray-200">Raja</td>
            <td class="py-3 px-4 border border-gray-200 font-medium bg-gray-50/80">X-9</td>
            <td class="py-3 px-4 border border-gray-200">Sragen</td>
          </tr>
          <tr class="hover:bg-indigo-50/50 transition-colors">
            <td class="py-3 px-4 border border-gray-200">4</td>
            <td class="py-3 px-4 border border-gray-200">Ahnaf</td>

            <td rowspan="2" class="py-3 px-4 border border-gray-200 font-medium bg-gray-50/80 align-middle">

            <td class="py-3 px-4 border border-gray-200">Sukoharjo</td>
          </tr>
        </tbody>

        <tfoot>
          <tr class="bg-gray-100 text-gray-800 font-bold text-sm">
            <td colspan="4" class="py-3 px-4 border border-gray-200 tracking-wide">
              SMA Al-Abidin Bilingual School Surakarta
            </td>
          </tr>
        </tfoot>

      </table>
