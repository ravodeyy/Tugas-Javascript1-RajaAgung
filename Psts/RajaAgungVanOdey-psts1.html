<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Ict Psts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div>
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold">Bazar Sma Abbs</h1>
            <p class="text-gray-600">Join To bazar sma abbs</p>
        </header>
        
        <main>
            <form action="#" method="post">
                
                <div class="mb-4">
                    <label for="student-name" class="block font-semibold mb-1">Student Name:</label>
                    <input type="text" id="student-name" name="student_name" required class="w-full border p-2 rounded">
                </div>

                  <div class="mb-4">
                    <label for="borrowed-lab" class="block font-semibold mb-1">Pick Your class:</label>
                    <select id="borrowed-lab" name="borrowed_lab" required class="w-full border p-2 rounded bg-white">
                        <option value="" disabled selected>-- Pick Your class --</option>
                        <option value="X">X</option>
                        <option value="XI">XI</option>
                         <option value="XII">XII</option>
                    </select>

                </div>
                  <div class="mb-4">
                    <label class="block font-semibold mb-1">Gender:</label>
                    <div class="flex gap-4">
                        <label>
                            <input type="radio" id="Male" name="Gender" value="Male" required> Male
                        </label>
                        <label>
                            <input type="radio" id="Female" name="Gender" value="Female"> Female
                        </label>
                    </div>
                </div>

                  <div class="mb-4">
                    <label for="borrowed-lab" class="block font-semibold mb-1">Sell Category:</label>
                    <select id="borrowed-lab" name="borrowed_lab" required class="w-full border p-2 rounded bg-white">
                        <option value="" disabled selected>-- Pick A Category --</option>
                        <option value="Food">Food</option>
                        <option value="Drink">Drink</option>
                         <option value="Tool">Tool</option>
                    </select>
                </div>

                </div>
                  <div class="mb-4">
                    <label class="block font-semibold mb-1">Participation Type:</label>
                    <div class="flex gap-4">
                        <label>
                            <input type="radio" id="Individual" name="Participation type" value="Individual" required> Individual
                        </label>
                        <label>
                            <input type="radio" id="Team" name="Participation type" value="Team"> Team
                        </label>
                    </div>
                </div>

                 
                <div class="mb-4">
                    <label for="Enter Your Boot" class="block font-semibold mb-1">Enter Your Boot Number:</label>
                    <input type="text" id="Enter Your Boot Number" name="Enter Your Boot Number" required class="w-full border p-2 rounded">
                </div>

                 
                <div class="mb-4">
                    <label for="Contact Number" class="block font-semibold mb-1">Contact Number:</label>
                    <input type="text" id="Contact Number" name="Contact Number" required class="w-full border p-2 rounded">
                </div>

                 <div class="mt-6">
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        Submit Reservation
                    </button>
                </div>

                <div class="w-full max-w-3xl px-4">
                    <div class="overflow-x-auto shadow-lg rounded-lg border border-gray-200 bg-white">
                        <table class="w-full text-center border-collapse">

                            <thead>
                                <tr class="bg-indigo-900 text-white font-bold text-lg tracking-wide uppercase">
                                    <th colspan="5 " class="py-3 px-4 border-b border-indigo-800">
                                        Participant Table 
                                    </th>
                                </tr>

                                <tr lass="bg-indigo-600 text-white font-semibold text-sm">
                                    <th class="py-2.5 px-4 border border-indigo-500">No</th>
                                    <th class="py-2.5 px-4 border border-indigo-500">Leader</th>
                                    <th class="py-2.5 px-4 border border-indigo-500">class</th>
                                    <th class="py-2.5 px-4 border border-indigo-500">Team</th>
                                    <th class="py-2.5 px-4 border border-indigo-500">Status</th>
                                </tr>
                            </thead>

                            <tbody class="text-gray-700 text-sm">
                                <tr class="hover:bg-indigo-50/50 transition-colors" >
                                    <td class="py-3 px-4 border border-gray-200">1</td>
                                    <td class="py-3 px-4 border border-gray-200">Narendra</td>
                                    <td class="py-3 px-4 border border-gray-200">X</td>
                                    <td class="py-3 px-4 border border-gray-200">Blackwidow</td>
                                    <td class="py-3 px-4 border border-gray-200">Registered</td>
                                </tr>
                            </tbody>

                            <tfoot>
                                 <tr class="hover:bg-indigo-50/50 transition-colors" >
                                    <td class="py-3 px-4 border border-gray-200">2</td>
                                    <td class="py-3 px-4 border border-gray-200">Velino</td>
                                    <td class="py-3 px-4 border border-gray-200">XII</td>
                                    <td class="py-3 px-4 border border-gray-200">MerahPutih</td>
                                    <td class="py-3 px-4 border border-gray-200">Registered</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
                
            </form>
        </main>
    </div>
</body>
</html>
